name: Buid and Test - Commit

on:
  push:
    branches: [ "conf_2023" ]
  pull_request:
    branches: [ "conf_2023" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'oracle'
        cache: maven
